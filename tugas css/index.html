<html>
    <head>
        <title>grid</title>
        <style>
            body, html{
                margin: 0;
                padding: 0;
                font-size: 20px;
                font-family: arial;
                color: white;
                text-transform: uppercase;
                text-align: center;

            }
            .container {
                width: 600px;
                margin: 50px auto;
                border: 5px solid #333;
                box-sizing: border-box;
                padding: 5px;
                display: grid;
                grid-template-areas: "header header"
                "aside main"
                "nav main"
                "footer footer";
                grid-template-columns: 1fr 1.5fr;
                grid-template-rows: 1fr 1fr 1.3fr;
            }
                header {
                    grid-area: header;
                    background-color: #b063d8;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }

                aside {
                    grid-area: aside;
                    background-color: #2f93ff;
                    padding: 60px 0;
                }

                nav {
                    grid-area: nav;
                    background-color: #e45765;
                    padding: 100px 0;
                }

                footer {
                    grid-area: footer;
                    background-color: #666;
                    padding: 20px 0;
                }
        </style>
    </head>
    <body>
        <div class="container">
            <header>header</header>
            <aside>aside</aside>
            <nav>nav</nav>
            <main>main</main>
            <footer>footer</footer>
        </div>
    </body>
</html>
